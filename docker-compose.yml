version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: greentify-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-greentify}
    ports:
      - "3306:3306"
    volumes:
      - greentify_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greentify-web
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:6Jb0N7q5H5eY4HhR4J3p6O8t6P3Q5R7S8T9U0V1W2X3=}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-greentify}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
    depends_on:
      db:
        condition: service_healthy

volumes:
  greentify_db_data:
